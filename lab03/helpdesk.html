<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="Help Desk, CWA, Swinburne">
    <meta name="author" content="Afnan Al Sanim">
    <title>CWA Help Desk Appointment</title>
</head>
<body>

    <!-- Swinburne logo with link -->
    <a href="http://www.swin.edu.au">
        <img src="images/logo.png" alt="Swinburne Logo">
    </a>

    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10.30 to 19.00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutors will be there.</p>

    <!-- Appointment form -->
    <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
        
        <!-- Student details section -->
        <fieldset>
            <legend>Student details</legend>
            
            <label for="studentid">Student ID</label>
            <input type="text" id="studentid" name="studentid" pattern="\d{7,10}" required>
            <br><br>
            
            <label for="givenname">Given Name</label>
            <input type="text" id="givenname" name="givenname" pattern="[A-Za-z]{1,15}" maxlength="15" required>
            
            <label for="familyname">Family Name</label>
            <input type="text" id="familyname" name="familyname" pattern="[A-Za-z]{1,15}" maxlength="15" required>
        </fieldset>

        <!-- Unit and tutor selection -->
        <fieldset>
            <legend>Your unit</legend>
            
            <input type="radio" id="cos10011" name="unit" value="COS10011" required>
            <label for="cos10011">COS10011</label>
            
            <input type="radio" id="cos60004" name="unit" value="COS60004">
            <label for="cos60004">COS60004</label>
            
            <input type="radio" id="cos60007" name="unit" value="COS60007">
            <label for="cos60007">COS60007</label>
            <br><br>
            
            <label for="tutor">Your Tutor</label>
            <select id="tutor" name="tutor" required>
                <option value="">Please Select</option>
                <option value="pawani">PAWANI T.RASARATNAM</option>
                <option value="chee">CHEE HUEI ANG</option>
                <option value="shanmuga">SHANMUGA A SAMY</option>
            </select>
        </fieldset>

        <!-- Issue selection and description -->
        <fieldset>
            <legend>Issue</legend>
            
            <label for="html">HTML</label>
            <input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">
            
            <label for="css">CSS</label>
            <input type="checkbox" id="css" name="issue[]" value="CSS">
            
            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="javascript" name="issue[]" value="JavaScript">

            <label for="php">PHP</label>
            <input type="checkbox" id="php" name="issue[]" value="PHP">

            <label for="mysql">MySQL</label>
            <input type="checkbox" id="mysql" name="issue[]" value="MySQL">
            <br><br>
            
            <label for="description">Description of Issue</label><br>
            <textarea id="description" name="description" rows="4" cols="50" placeholder="Write description of your problem here..."></textarea>
        </fieldset>

        <!-- Preferred date and time -->
        <fieldset>
            <legend>Preferred Date / Time</legend>
            
            <label for="date">Date</label>
            <input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
            <br><br>
            
            <label for="time">Time</label>
            <input type="text" id="time" name="time" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
        </fieldset>
        
        <br>
        <input type="submit" value="Book">
        <input type="reset" value="Reset form">
    </form>

</body>
</html>
